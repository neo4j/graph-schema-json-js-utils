name: Release

on: workflow_dispatch

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC trusted publishing
      contents: write   # Required for git push

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm CLI
        run: npm install -g npm@11.5.1

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure git
        run: |
          git config --global user.email "team-nx@neo4j.com"
          git config --global user.name "GitHub Action Automation"
          
      - name: Bump version
        run: |
          npm run changeset version
          git add . && git commit -am "Version bump"

      - name: Publish to npm
        run: npm run changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Git push changes back to origin
        run: git push && git push --tags
